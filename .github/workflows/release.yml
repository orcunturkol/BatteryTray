name: Release

# Builds BatteryTray.exe on Windows and publishes it as a GitHub release.
#  - Push a tag like v0.0.3 (annotated; its message becomes the release notes), or
#  - run the workflow by hand (Actions -> Release -> Run workflow) with a tag and notes;
#    the tag is then created on the commit the workflow runs on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.0.3'
        required: true
        type: string
      notes:
        description: 'Release notes (markdown)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check tag
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' doesn't look like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never interpolated into the script
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' "$NOTES" > notes.md
            gh release create "$TAG" out/BatteryTray.exe \
              --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          else
            # Make sure the annotated tag object (not just the commit) is available for --notes-from-tag
            git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
            gh release create "$TAG" out/BatteryTray.exe \
              --verify-tag --title "$TAG" --notes-from-tag
          fi
